name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint y formato
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Tipos
        run: mypy src

      - name: Arquitectura (el dominio no depende de la infraestructura)
        run: lint-imports

      - name: Seguridad del código y dependencias
        run: |
          bandit -q -r src
          pip-audit

      - name: Secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pruebas con cobertura
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinelops:ci .
