[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinelops"
version = "0.0.1"
description = "Diagnóstico de incidentes con evidencias: ingesta, detección, correlación y evaluación reproducible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "import-linter>=2.0",
    "pre-commit>=3.8",
]
otel = [
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
]

[project.scripts]
sentinelops-worker = "sentinelops.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelops"]

# ---------- Calidad ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # tildes y signos del español en textos
    "N818",  # errores de dominio con nombres del lenguaje ubicuo (InvalidTransition)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S311"]
"src/sentinelops/ingestion/synthetic.py" = ["S311"]  # random con semilla: no es criptografía

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["sentinelops"]
branch = true

# ---------- Arquitectura: el dominio no depende de la infraestructura ----------
[tool.importlinter]
root_package = "sentinelops"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El dominio no importa capas externas"
type = "forbidden"
source_modules = ["sentinelops.domain"]
forbidden_modules = [
    "sentinelops.api",
    "sentinelops.persistence",
    "sentinelops.application",
    "fastapi",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Los algoritmos son puros (sin API ni persistencia)"
type = "forbidden"
source_modules = ["sentinelops.detection", "sentinelops.correlation", "sentinelops.diagnosis"]
forbidden_modules = ["sentinelops.api", "sentinelops.persistence", "fastapi", "sqlalchemy"]
