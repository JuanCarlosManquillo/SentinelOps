name: sentinelops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinelops}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sin puerto publicado: solo accesible desde la red interna de Compose.
    # Para usar el puerto desde el host, hay q descomenta la linea de abajo 
    ports: ["127.0.0.1:15432:5432"]

  api:
    build: .
    env_file: .env
    environment:
      SENTINELOPS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinelops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sentinelops}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]

  # Semana 2: el worker en modo continuo con checkpoint.
  # worker:
  #   build: .
  #   env_file: .env
  #   command: ["sentinelops-worker"]
  #   depends_on: { db: { condition: service_healthy } }

  # Semana 4: colector OpenTelemetry
  # otel-collector:
  #   image: otel/opentelemetry-collector:latest
  #   command: ["--config=/etc/otelcol/config.yaml"]

volumes:
  pgdata:
